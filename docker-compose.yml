services:
  postgres:
    image: postgres:16-alpine
    container_name: fixmap-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: fixhack
    volumes:
      - fixmap_pg_data:/var/lib/postgresql/data

volumes:
  fixmap_pg_data:
